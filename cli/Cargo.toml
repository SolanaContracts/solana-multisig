[package]
name = "multisig-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "multisig-cli"
path = "src/main.rs"

[dependencies]
solana-multisig = { path = "../programs/solana-multisig", features = ["no-entrypoint"] }
anchor-client = "0.32.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
base64 = "0.21"
